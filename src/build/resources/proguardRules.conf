-keepattributes *Annotation*,Signature,EnclosingMethod,InnerClasses,SourceFile,LineNumberTable
-dontskipnonpubliclibraryclasses
-dontskipnonpubliclibraryclassmembers
-dontshrink
-dontoptimize
-overloadaggressively
-allowaccessmodification
-ignorewarnings
-dontwarn
-dontnote

-adaptresourcefilecontents plugin.yml,META-INF/MANIFEST.MF

-repackageclasses ${plugin.pckg}.internal
-keeppackagenames !${plugin.pckg}.internal.**

-keep class !${plugin.pckg}.internal.** { *; }
